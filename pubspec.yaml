name: family_vault
description: "Family Vault - a secure, offline-first, zero-knowledge password manager for Android and Windows."
publish_to: "none"

# version+build. The build number is bumped by CI for release tags.
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Dependencies are added one per commit and confirmed green in CI before the
# next, because this project is authored in an environment that cannot resolve
# or compile them. See docs/decisions-and-risks.md, decision D-002.
dependencies:
  flutter:
    sdk: flutter

  # Annotations only (@immutable). Maintained by the Dart team.
  meta: ^1.15.0

  # libsodium bindings: Argon2id and XChaCha20-Poly1305.
  # Argon2id lives in libsodium's "sumo" interface, reached through
  # package:sodium/sodium_sumo.dart. Version verified by CI run 42620302996 on
  # both Android and Windows. See decision D-003.
  sodium: ^4.1.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <8.0.0"

flutter:
  uses-material-design: true
