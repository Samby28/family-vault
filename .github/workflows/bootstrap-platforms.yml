name: Bootstrap platform projects

# One-time, manually triggered workflow.
#
# The authoring environment has no Flutter SDK, so it cannot run
# `flutter create` to produce the android/, windows/ and web/ projects. This
# workflow generates them from Flutter's own templates and commits them, after
# which the repository is self-contained: a reviewer can clone it and run
# `flutter build` with no extra step.
#
# Once those directories are committed this workflow has nothing left to do and
# is removed. See docs/decisions-and-risks.md, decision D-004.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    name: Generate and commit platform projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Generate platform projects
        run: bash tool/bootstrap_platforms.sh

      - name: Resolve dependencies to produce the lockfile
        run: flutter pub get

      - name: Show what was generated
        run: |
          git status --short | head -50
          echo "files: $(git status --porcelain | wc -l)"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit - platform projects already present."
            exit 0
          fi
          git commit -m "Add generated Android, Windows and web projects

          Generated by tool/bootstrap_platforms.sh from Flutter 3.47.9's own
          templates, because the authoring environment has no Flutter SDK and
          cannot run flutter create. Committing them makes the repository
          self-contained: a reviewer can clone and build with no extra step,
          and the bootstrap script becomes a no-op.

          Also adds the resolved pubspec.lock. This is an application rather
          than a library, so the lockfile is committed for reproducible builds."
          git push
