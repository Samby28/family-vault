name: Crypto library probe

# Temporary, manually triggered. Final probe before the cryptographic core is
# written. Removed once decision D-003 is recorded.
#
# Settled so far:
#   Probe 1 (42618366937) - sodium 4.1.2+1 resolves; APK and Windows both build
#     with libsodium added; libsodium 1.0.18 installs on the Linux runner.
#   Probe 2 (42619562544) - Argon2id lives in the sumo variant, reached through
#     package:sodium/sodium_sumo.dart; SodiumSumoInit.init() is synchronous and
#     uses a bundled libsodium, so no dynamic-library loader is needed;
#     Aead.encrypt/decrypt accept additionalData, which is what lets the vault
#     header be authenticated; and sodium_libs is DEPRECATED, with everything
#     moved into sodium itself.
#
# This probe answers the last two questions:
#   1. The CryptoPwhashAlgorithm values, so Argon2id can be selected explicitly
#      rather than left to a default. A password manager must not infer which
#      KDF it is using.
#   2. Whether sodium alone, without the deprecated sodium_libs, still builds
#      on both platforms.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Print the remaining interfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Add sodium only
        run: |
          flutter pub add sodium
          echo "::group::dependencies"
          sed -n '/^dependencies:/,/^dev_dependencies:/p' pubspec.yaml
          echo "::endgroup::"

      - name: Print the interfaces whole
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          ROOT=$(find "$CACHE"/hosted/pub.dev -maxdepth 1 -type d -name "sodium-*" | head -1)
          for rel in \
            lib/src/api/sumo/pwhash.dart \
            lib/src/api/secure_key.dart \
            lib/src/api/randombytes.dart \
            lib/src/api/sodium.dart \
            lib/src/api/sodium_exception.dart
          do
            f="$ROOT/$rel"
            if [ -f "$f" ]; then
              echo "::group::FILE $rel"
              cat "$f"
              echo "::endgroup::"
            else
              echo "MISSING: $rel"
            fi
          done

  build-android:
    name: APK with sodium alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub add sodium
      - run: flutter build apk --release
      - run: ls -lh build/app/outputs/flutter-apk/

  build-windows:
    name: Windows with sodium alone
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub add sodium
      - run: flutter build windows --release
      - shell: pwsh
        run: |
          $dir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $dir)) { $dir = "build/windows/runner/Release" }
          Get-ChildItem $dir -Recurse -Include *.dll,*.exe |
            Select-Object Name, Length
