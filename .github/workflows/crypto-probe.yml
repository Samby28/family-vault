name: Crypto library probe

# Temporary, manually triggered. Settles decision D-003 with evidence.
#
# Probe 1 (run 42618366937) established that:
#   - sodium 4.1.2+1 and sodium_libs 4.0.1 resolve
#   - an Android APK and a Windows application both still build with them
#   - libsodium 1.0.18 installs on the Linux runner as libsodium.so.23
#   - Crypto exposes aeadXChaCha20Poly1305IETF
#   - there is NO lib/src/api/pwhash.dart, so Argon2id is not in the base API;
#     it belongs to the "sumo" variant
#
# Probe 2 answers what remains before the core can be written: where Pwhash
# lives, whether sodium_libs can supply a sumo build for Android and Windows,
# and the exact signatures of the methods this project will call. Printing the
# files whole rather than grepping them, because probe 1's grep matched only
# getters and missed every method.
#
# Removed once D-003 is recorded.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Locate Pwhash and print exact signatures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Add candidates, including the sumo variant if one exists
        run: |
          flutter pub add sodium sodium_libs
          echo "::group::Is there a separate sumo package?"
          flutter pub add sodium_libs_sumo 2>&1 | tail -5 || \
            echo "NO sodium_libs_sumo package (or it failed to resolve)"
          echo "::endgroup::"
          echo "::group::pubspec dependencies"
          sed -n '/^dependencies:/,/^dev_dependencies:/p' pubspec.yaml
          echo "::endgroup::"

      - name: Where does Pwhash live?
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "::group::Files mentioning pwhash across all sodium packages"
          grep -rl -i "pwhash" "$CACHE"/hosted/pub.dev/sodium*/lib 2>/dev/null \
            | sed "s|$CACHE/hosted/pub.dev/||" | sort
          echo "::endgroup::"
          echo "::group::Sumo entry points"
          find "$CACHE"/hosted/pub.dev/sodium*/lib -iname "*sumo*" 2>/dev/null \
            | sed "s|$CACHE/hosted/pub.dev/||" | sort
          echo "::endgroup::"
          echo "::group::sodium_libs package contents"
          find "$CACHE"/hosted/pub.dev/sodium_libs-*/lib -name "*.dart" 2>/dev/null \
            | sed "s|$CACHE/hosted/pub.dev/||" | sort
          echo "::endgroup::"

      - name: Print the files this project will be written against
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          ROOT=$(find "$CACHE"/hosted/pub.dev -maxdepth 1 -type d -name "sodium-*" | head -1)

          show() {
            if [ -f "$1" ]; then
              echo "::group::FILE $(echo "$1" | sed "s|$CACHE/hosted/pub.dev/||")"
              cat -n "$1"
              echo "::endgroup::"
            else
              echo "MISSING: $1"
            fi
          }

          # The AEAD interface: encrypt, decrypt, and their detached forms.
          show "$ROOT/lib/src/api/aead.dart"
          # The sumo entry point, which should expose Pwhash.
          show "$ROOT/lib/sodium_sumo.dart"
          # Whatever file actually declares Pwhash.
          for f in $(grep -rl "abstract class Pwhash\|class Pwhash" "$ROOT/lib" 2>/dev/null); do
            show "$f"
          done
          # Key material handling and the random source.
          show "$ROOT/lib/src/api/secure_key.dart"
          show "$ROOT/lib/src/api/randombytes.dart"

      - name: Print the sumo crypto surface and the init entry points
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          ROOT=$(find "$CACHE"/hosted/pub.dev -maxdepth 1 -type d -name "sodium-*" | head -1)
          LIBS=$(find "$CACHE"/hosted/pub.dev -maxdepth 1 -type d -name "sodium_libs-*" | head -1)
          for f in $(find "$ROOT/lib" -iname "*sumo*" -name "*.dart" 2>/dev/null | head -8); do
            echo "::group::FILE $(echo "$f" | sed "s|$CACHE/hosted/pub.dev/||")"
            cat -n "$f" | head -120
            echo "::endgroup::"
          done
          for f in $(find "$LIBS/lib" -name "*.dart" 2>/dev/null | head -10); do
            echo "::group::FILE $(echo "$f" | sed "s|$CACHE/hosted/pub.dev/||")"
            cat -n "$f" | head -120
            echo "::endgroup::"
          done
