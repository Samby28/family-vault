name: Release

# Publishes installable builds to a GitHub Release so that family members and
# capstone assessors can download them from one page.
#
# Triggered by pushing a tag such as v0.1.0, or manually.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - name: Name the file for humans
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/FamilyVault-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/FamilyVault-Android.apk
          if-no-files-found: error

  windows:
    name: Windows application
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - shell: bash
        run: bash tool/bootstrap_platforms.sh
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Package application
        shell: pwsh
        run: |
          $candidates = @(
            "build/windows/x64/runner/Release",
            "build/windows/runner/Release"
          )
          $found = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { $found = $c; break }
          }
          if (-not $found) {
            Write-Error "No Windows build output found."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$found/*" `
            -DestinationPath "dist/FamilyVault-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/FamilyVault-Windows.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p dist
          find artifacts -type f \( -name '*.apk' -o -name '*.zip' \) \
            -exec cp {} dist/ \;
          ls -lh dist/

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Family Vault

          Secure, offline-first password manager for Android and Windows.
          Your vault is encrypted on your own device. Nothing is sent to any
          server, and no server can read it.

          ### Downloads

          | File | For |
          |---|---|
          | `FamilyVault-Android.apk` | Android phones and tablets |
          | `FamilyVault-Windows.zip` | Windows 10 and 11 |

          ### Installing on Android

          Android will warn that the app is from an unknown developer, because
          this build is signed with a development key rather than a store key.
          Allow the install from your browser or file manager when prompted.

          ### Installing on Windows

          Unzip the folder anywhere and run `family_vault.exe`. Keep the whole
          folder together; the program needs the files beside it.

          ### Please read

          Your master password cannot be recovered. If you forget it, the vault
          cannot be opened by anyone, including us. Write it down and keep it
          somewhere safe.

          See `docs/known-limitations.md` in the repository for what is and is
          not implemented in this version. This project has not had an
          independent security audit.
          NOTES

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Family Vault $TAG" \
              --notes-file notes.md
          fi
